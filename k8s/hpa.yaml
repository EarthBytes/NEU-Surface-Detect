apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neu-surface-detect-hpa
  namespace: neu-surface-detect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neu-surface-detect-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
