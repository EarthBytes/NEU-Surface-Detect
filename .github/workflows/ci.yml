name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest tests/ -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch \
            torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Create fixture checkpoint
        run: python tests/create_fixture_checkpoint.py

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inference/Dockerfile
          tags: neu-surface-detect-api:ci
          push: false

      - name: Start container
        run: |
          docker run -d \
            --name neu-api \
            -p 8000:8000 \
            neu-surface-detect-api:ci

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Container failed health check."
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs neu-api

      - name: Clean up
        if: always()
        run: docker rm -f neu-api || true

  k8s-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Validate default manifests
        run: kubectl kustomize k8s/ | kubectl apply --dry-run=client --validate=false -f -

      - name: Validate S3 manifests
        run: |
          kubectl apply --dry-run=client --validate=false \
            -f k8s/namespace.yaml \
            -f k8s/configmap-s3.yaml \
            -f k8s/deployment-s3.yaml \
            -f k8s/service.yaml \
            -f k8s/hpa.yaml \
            -f k8s/ingress.yaml

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs:
      - docker
      - k8s-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch \
            torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Create fixture checkpoint
        run: python tests/create_fixture_checkpoint.py

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: inference/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/neu-surface-detect-api:staging-${{ github.sha }}
            ghcr.io/${{ github.repository }}/neu-surface-detect-api:staging

      - name: Deploy to staging cluster
        if: env.KUBE_CONFIG_DATA != ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          kubectl kustomize k8s/ \
            | sed "s|neu-surface-detect-api:v1|ghcr.io/${{ github.repository }}/neu-surface-detect-api:staging-${{ github.sha }}|g" \
            | sed 's|imagePullPolicy: Never|imagePullPolicy: IfNotPresent|g' \
            | kubectl apply -f -
          kubectl rollout status deployment/neu-surface-detect-api -n neu-surface-detect --timeout=300s

      - name: Staging deploy note
        if: env.KUBE_CONFIG_DATA == ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_STAGING }}
        run: |
          echo "Image pushed to ghcr.io/${{ github.repository }}/neu-surface-detect-api:staging-${{ github.sha }}"
          echo "Set repository secret KUBE_CONFIG_STAGING to enable automatic kubectl apply."

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production cluster
        if: env.KUBE_CONFIG_DATA != ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          STAGING_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          kubectl kustomize k8s/ \
            | sed "s|neu-surface-detect-api:v1|ghcr.io/${{ github.repository }}/neu-surface-detect-api:staging-${STAGING_SHA}|g" \
            | sed 's|imagePullPolicy: Never|imagePullPolicy: IfNotPresent|g' \
            | kubectl apply -f -
          kubectl rollout status deployment/neu-surface-detect-api -n neu-surface-detect --timeout=300s

      - name: Production deploy note
        if: env.KUBE_CONFIG_DATA == ''
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
        run: |
          echo "Promote ghcr.io/${{ github.repository }}/neu-surface-detect-api:staging-${{ github.sha }} after staging validation."
          echo "Set repository secret KUBE_CONFIG_PRODUCTION to enable automatic kubectl apply."
