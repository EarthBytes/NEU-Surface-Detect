name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: pytest tests/ -v

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch \
            torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Create fixture checkpoint
        run: python tests/create_fixture_checkpoint.py

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: inference/Dockerfile
          tags: neu-surface-detect-api:ci
          push: false

      - name: Start container
        run: |
          docker run -d \
            --name neu-api \
            -p 8000:8000 \
            neu-surface-detect-api:ci

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Container failed health check."
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs neu-api

      - name: Clean up
        if: always()
        run: docker rm -f neu-api || true

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Placeholder - staging deployment
        run: |
          echo "Build and push image to your container registry."
          echo "Deploy updated image to the staging environment."

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Placeholder - production deployment
        run: |
          echo "Promote the validated image to production."
          echo "Trigger Kubernetes or ECS rollout after approval."
