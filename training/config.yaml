data:
  processed_version: v1
  image_size: 224
  test_ratio: 0.15
  seed: 42

# Dataset location for training and evaluation.
# source: local  -> read from paths.processed_data (repo dataset/ folder)
# source: s3     -> sync from S3 into cache_dir, then train from cache
# Override at runtime: DATA_SOURCE=s3 python -m training.train
dataset:
  source: s3
  bucket: neu-cnn-surface-detect
  prefix: dataset/
  cache_dir: .cache/dataset

model:
  architecture: resnet18
  pretrained: true
  num_classes: 6

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 2
  checkpoint_name: best_model.pt

augmentation:
  horizontal_flip: 0.5
  rotation_degrees: 10

paths:
  raw_data: dataset/NEU-DET
  processed_data: dataset/processed
  checkpoints: models/checkpoints
  evaluation: models/evaluation

mlflow:
  tracking_uri: sqlite:///models/mlflow.db
  experiment_name: neu-surface-defect
  registered_model_name: neu-defect-classifier

inference:
  checkpoint: models/checkpoints/best_model.pt
  host: 0.0.0.0
  port: 8000

monitoring:
  enabled: true
  log_path: models/monitoring/predictions.jsonl
  drift_window_size: 100
  low_confidence_threshold: 0.5
  class_share_threshold: 0.6
  brightness_tolerance: 0.15
  save_feedback_images: true
  feedback_dir: dataset/feedback/inbox

retraining:
  experiment_name: neu-surface-defect-retraining
  min_improvement: 0.0
  champion_checkpoint: models/checkpoints/best_model.pt
  challenger_checkpoint: models/checkpoints/challenger_model.pt
  comparison_output: models/evaluation/comparison.json

# AWS SageMaker GPU training (launched from your machine via launch_aws_training).
# Credentials and role ARN come from the environment — never commit secrets.
aws:
  region: eu-west-1
  bucket: neu-cnn-surface-detect
  output_prefix: training-output/
  sagemaker_role_arn: null  # or set SAGEMAKER_ROLE_ARN in the environment
  instance_type: ml.g4dn.xlarge
  instance_count: 1
  max_runtime_seconds: 3600
  pytorch_version: "2.0.0"
  python_version: py310
