data:
  processed_version: v1
  image_size: 224
  test_ratio: 0.15
  seed: 42

model:
  architecture: resnet18
  pretrained: true
  num_classes: 6

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 2
  checkpoint_name: best_model.pt

augmentation:
  horizontal_flip: 0.5
  rotation_degrees: 10

paths:
  raw_data: dataset/NEU-DET
  processed_data: dataset/processed
  checkpoints: models/checkpoints
  evaluation: models/evaluation
